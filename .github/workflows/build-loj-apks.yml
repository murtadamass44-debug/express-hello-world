name: Build LOJ Mobile and TV APKs
on:
  push:
    branches:
      - loj-android-build
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APKs
        run: gradle --no-daemon :app:assembleMobileDebug :app:assembleTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LOJ-Mobile-APK
          path: app/build/outputs/apk/mobile/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LOJ-TV-APK
          path: app/build/outputs/apk/tv/debug/*.apk
